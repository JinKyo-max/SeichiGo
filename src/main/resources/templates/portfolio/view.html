<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <meta charset="UTF-8">
  <title th:text="${work.title}">アニメ作品詳細</title>

  <style>
    .content-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .write-button {
      text-align: right;
      margin-bottom: 20px;
    }

    .write-button a {
      padding: 10px 20px;
      background-color: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .place-section {
      margin-top: 40px;
    }

    .place-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .place-table th,
    .place-table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      vertical-align: middle;
    }

    .place-table th {
      background-color: #f2f2f2;
      font-weight: bold;
    }

    .place-image-small {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .marker-name {
      font-size: 16px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 500px;
      margin-top: 40px;
      border-radius: 10px;
      overflow: hidden;
    }

    #searchInput {
      padding: 8px;
      width: 300px;
      border-radius: 5px;
      border: 1px solid #ccc;
      float: right;
      margin-top: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div layout:fragment="content" class="content-wrapper">

  <div class="write-button"
       th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <a th:href="@{/anime/place-write}">聖地場所登録</a>
  </div>

  <h2>地図</h2>
  <div id="map"></div>

  <input type="text"
         id="searchInput"
         placeholder="キーワードで検索 (例: 1話, 神社, 渋谷)">

  <div class="place-section">
    <h2>聖地巡礼スポット</h2>

    <table class="place-table" id="placeTable">

      <thead>
        <tr>
          <th>アニメ画像</th>
          <th>実際の写真</th>
          <th>マーカー名</th>
          <th>住所</th>
          <th style="display:none;">説明</th>
          <th style="display:none;">地域</th>
        </tr>
      </thead>

      <tbody>

        <tr th:each="place : ${places}">

          <td>
            <a th:href="@{/anime/detail(place_id=${place.place_id})}">
              <img th:src="@{${place.image}}"
                   alt="アニメ写真"
                   class="place-image-small">
            </a>
          </td>

          <td>
            <img th:src="@{${place.realimage}}"
                 alt="実際の写真"
                 class="place-image-small">
          </td>

          <td class="marker-name"
              th:text="${place.name}">
            場所名
          </td>

          <td th:text="${place.address}">
            住所
          </td>

          <td th:text="${place.description}"
              style="display:none;">
          </td>

          <td th:text="${place.region}"
              style="display:none;">
          </td>

        </tr>

      </tbody>

    </table>
  </div>

</div>


<th:block layout:fragment="script">

  <script th:inline="javascript">

    let places = JSON.parse(/*[[${placesJson}]]*/ "[]");

    console.log("places:", places);


    window.initMap = function () {

      const center = {
        lat: 35.681236,
        lng: 139.767125
      };

      const map = new google.maps.Map(
        document.getElementById("map"),
        {
          zoom: 11,
          center: center
        }
      );


      if (places.length > 0) {

        const bounds =
          new google.maps.LatLngBounds();


        places.forEach(place => {

          const lat =
            Number(place.latitude);

          const lng =
            Number(place.longitude);


          if (
            !isNaN(lat) &&
            !isNaN(lng) &&
            lat !== 0 &&
            lng !== 0
          ) {

            const pos = {
              lat: lat,
              lng: lng
            };


            const marker =
              new google.maps.Marker({

                position: pos,

                map: map,

                title: place.name

              });


            const info =
              new google.maps.InfoWindow({

                content:
                  `<strong>${place.name}</strong><br>
                   ${place.description || ""}`

              });


            marker.addListener(
              "click",
              () => info.open(map, marker)
            );


            bounds.extend(pos);

          }

        });


        map.fitBounds(bounds);

      }

    };


    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const input =
          document.getElementById("searchInput");

        const rows =
          document.querySelectorAll(
            "#placeTable tbody tr"
          );


        input.addEventListener(
          "keyup",
          function () {

            const keyword =
              input.value.toLowerCase();


            rows.forEach(row => {

              const name =
                row.querySelector(".marker-name")
                  ?.textContent
                  .toLowerCase() || "";

              const address =
                row.cells[3]
                  ?.textContent
                  .toLowerCase() || "";

              const description =
                row.cells[4]
                  ?.textContent
                  .toLowerCase() || "";

              const region =
                row.cells[5]
                  ?.textContent
                  .toLowerCase() || "";


              const match =
                [
                  name,
                  address,
                  description,
                  region
                ].some(
                  text =>
                    text.includes(keyword)
                );


              row.style.display =
                match ? "" : "none";

            });

          }
        );

      }
    );

  </script>


  <!--
    Google Maps API를 실제로 실행하려면
    YOUR_API_KEY 부분에 자신의 API Key를 설정합니다.
    공개 GitHub 저장소에는 실제 API Key를 올리지 않습니다.
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
    async
    defer>
  </script>

</th:block>

</body>
</html>
