<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/layout}">
<head>
  <meta charset="UTF-8">
  <title>聖地登録</title>

  <style>
    .form-container {
      width: 600px;
      margin: 50px auto;
      padding: 30px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #fafafa;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .submit-btn {
      background-color: #1976d2;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div layout:fragment="content">

  <h1 style="text-align:center;">聖地スポット登録</h1>

  <div class="form-container">
    <form th:action="@{/anime/place-write}" method="post" enctype="multipart/form-data">

      <div class="form-group">
        <label>作品ID (work_id)</label>
        <input type="text" name="work_id" required />
      </div>

      <div class="form-group">
        <label>スポット名 (name)</label>
        <input type="text" name="name" required />
      </div>

      <div class="form-group">
        <label>住所 (address)</label>
        <input type="text" name="address" required />
      </div>

      <div class="form-group">
        <label>画像 (image)</label>
        <input type="file" name="imageFile" />
      </div>

      <div class="form-group">
        <label>実際の写真 (real_image)</label>
        <input type="file" name="realimageFile" />
      </div>

      <div class="form-group">
        <label>説明 (description)</label>
        <textarea name="description" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label>緯度 (latitude)</label>
        <input type="text" name="latitude" required />
      </div>

      <div class="form-group">
        <label>経度 (longitude)</label>
        <input type="text" name="longitude" required />
      </div>

      <div style="text-align:center;">
        <button type="submit" class="submit-btn">登録する</button>
      </div>

    </form>
  </div>

</div>
</body>
</html>
