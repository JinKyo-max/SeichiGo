<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
  <meta charset="UTF-8">
  <title th:text="${place.name}">聖地詳細</title>

  <style>
    .detail-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .images {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .images img {
      width: 50%;
      height: 300px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .info-block {
      margin-bottom: 20px;
    }

    .info-title {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 10px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div layout:fragment="content">

  <div class="detail-container">

    <h2 th:text="${place.name}">場所名</h2>

    <div class="images">
      <img th:src="@{${place.image}}" alt="アニメ画像">
      <img th:src="@{${place.realimage}}" alt="実際の写真">
    </div>

    <div class="info-block">
      <div class="info-title">住所</div>
      <div th:text="${place.address}">日本、○○県○○市</div>
    </div>

    <div class="info-block">
      <div class="info-title">説明</div>
      <div th:text="${place.description}">
        アニメで登場した場面の実際の場所です。
      </div>
    </div>

    <div class="info-block">
      <div class="info-title">地図</div>
      <div id="map"></div>
    </div>

  </div>


  <th:block layout:fragment="script">

    <script th:inline="javascript">

      /*<![CDATA[*/

      const latitude =
        /*[[${place.latitude}]]*/ 35.0;

      const longitude =
        /*[[${place.longitude}]]*/ 139.0;


      function initMap() {

        const location = {
          lat: latitude,
          lng: longitude
        };


        const map =
          new google.maps.Map(
            document.getElementById("map"),
            {
              zoom: 15,
              center: location
            }
          );


        new google.maps.Marker({
          position: location,
          map: map,
          title: /*[[${place.name}]]*/ "場所名"
        });

      }


      window.onload = initMap;

      /*]]>*/

    </script>


    <!--
      Google Maps API를 실행하려면
      YOUR_API_KEY 부분에 자신의 API Key를 설정합니다.
      공개 GitHub 저장소에는 실제 API Key를 올리지 않습니다.
    -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"
      async
      defer>
    </script>

  </th:block>

</div>

</body>
</html>
